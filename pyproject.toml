[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-clutter-hybrid-ica-reproducibility"
version = "1.0.0"
description = "Reproducibility package: reference validity and calibration limits of reference-conditioned detection in sea clutter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hamzeh Ghahramani", email = "hamze.ghahramani@gmail.com" }]
keywords = ["sea clutter", "small-target detection", "polarimetric radar", "complex ICA", "false-alarm calibration"]
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.1",
  "torch==2.13.0",
  "matplotlib==3.11.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "Pillow==12.0.0"]

[tool.setuptools]
packages = ["src", "src.baselines", "src.data", "src.eval", "src.proposed", "src.statistics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
